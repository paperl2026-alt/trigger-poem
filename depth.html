<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2.5D 场景验证</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120c14; font-family: "Microsoft YaHei", sans-serif; }
    #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    #ui { position: fixed; left: 16px; top: 16px; z-index: 2; background: #000c; color: #fff; padding: 12px 14px; border: 3px solid #fff; box-shadow: 6px 6px 0 #d8141e;
      width: 290px; font-size: 14px; line-height: 1.5; user-select: none; }
    #ui h1 { margin: 0 0 4px; font-size: 18px; color: #ff5a64; }
    #ui p { margin: 0 0 8px; color: #ccc; font-size: 12px; }
    #ui label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
    #ui input[type=range] { width: 140px; }
    #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #ui button { font: 13px "Microsoft YaHei", sans-serif; background: #222; color: #fff; border: 2px solid #666; padding: 4px 9px; cursor: pointer; }
    #ui button.on { border-color: #ff5a64; color: #ff5a64; }
    #ui.min > *:not(h1) { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/depth/main.js"></script>
</body>
</html>
